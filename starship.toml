"$schema" = "https://starship.rs/config-schema.json"

format = """
$os$username$directory$git_branch$git_status$nodejs$python$golang$rust$terraform$docker_context$character
"""

right_format = "$battery$time"

palette = "clean_mint"
add_newline = true

[os]
disabled = false
style = "bold fg:sky"
format = "[$symbol ]($style)"

[os.symbols]
Macos = ""
Linux = "🐧"
Ubuntu = ""
Windows = ""

[username]
show_always = true
style_user = "fg:text"
style_root = "bold fg:red"
format = "[$user ]($style)"

[directory]
style = "bold fg:peach"
format = "[📁 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 🔒"

[directory.substitutions]
Documents = "📄"
Downloads = ""
Music = "🎵"
Pictures = "🖼️"
Developer = "💻"

[git_branch]
symbol = ""
style = "fg:green"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:yellow"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "fg:green"
format = "[ via $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:green"
format = "[ via $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:blue"
format = "[ via $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:green"
format = "[ via $symbol $version ]($style)"

[terraform]
symbol = ""
style = "fg:lavender"
format = "[ via $symbol $version ]($style)"

[docker_context]
symbol = ""
style = "fg:blue"
format = "[ in $symbol $context ]($style)"

[azure]
disabled = false
format = 'on [$symbol($subscription)]($style) '
symbol = '󰠅 '
style = 'blue bold'


[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "🔋"
unknown_symbol = "❓"
empty_symbol = "🪫"
format = "[ $symbol $percentage ]($style)"
display = [
	{ threshold = 20, style = "bold fg:red" },
	{ threshold = 50, style = "fg:yellow" },
	{ threshold = 100, style = "fg:green" },
]

[time]
disabled = false
time_format = "%H:%M"
style = "fg:lavender"
format = "[ 🕒 $time ]($style)"


[line_break]
disabled = true

[character]
success_symbol = "[ ➜ ](bold fg:green)"
error_symbol = "[ ➜ ](bold fg:red)"
vimcmd_symbol = "[ ❮ ](bold fg:sky)"

[palettes.clean_mint]
text = "#d9e0ee"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
sky = "#89dceb"
peach = "#fab387"
lavender = "#b4befe"
crust = "#dce0e8"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
